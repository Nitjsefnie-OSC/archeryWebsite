# OSC fork CI wrapper - generated by scripts/make_wrapper.py;
# check with scripts/verify_wrapper.py before pushing.
# Jobs kept (verbatim, except the two sanctioned adaptations:
# checkout pinned to ${{ inputs.target_ref }}, and the inserted
# Provenance step):
#   - build
#   - runner-safety
#   - go-unit
#   - go-integration
#   - frontend
#   - e2e-manual-engine [keeps its own if: (github.event_name == 'workflow_dispatch' && inputs.browser != 'chromium') - evaluated as written on workflow_dispatch too]
# DELIBERATELY EXCLUDED (loud):
#   - e2e: if: only fires on pull_request, so it is skipped under workflow_dispatch

name: OSC manual CI

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Git branch, tag, or 40-character commit SHA to validate'
        required: true
        type: string
      browser:
        description: Optional manual browser suite
        required: false
        type: choice
        default: chromium
        options: [chromium, firefox, webkit]
      mode:
        description: Lifecycle scoring execution mode
        required: false
        type: choice
        default: hybrid
        options: [hybrid, full-ui]

permissions:
  contents: read

concurrency:
  group: osc-manual-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - name: Verify deployment configuration boundaries
      run: node --test scripts/deployment-config.test.mjs
    - name: Validate modern Compose
      run: docker compose --env-file .env.example -p archery-build-check -f docker-compose.yml
        config --quiet
    - name: Validate Compose V1 1.29.2 (read-only, no daemon socket)
      run: docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace docker/compose:1.29.2
        --env-file .env.example -p archery-build-check -f docker-compose.yml config
        --quiet
    - name: Validate Caddy HTTP and HTTPS configuration
      run: |
        docker run --rm --network none -e ARCHERY_SITE_ADDRESS=:80 -v "$PWD/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
        docker run --rm --network none -e ARCHERY_SITE_ADDRESS=archery.example.org -e ARCHERY_ACME_EMAIL=admin@example.org -v "$PWD/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
    - name: Build with example settings only
      run: |
        docker compose --env-file .env.example -p archery-build-check -f docker-compose.yml build
  runner-safety:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - uses: actions/setup-go@v5
      with:
        go-version: 1.23.x
        cache-dependency-path: backend/go.sum
    - run: node --test scripts/test-env.test.mjs scripts/test-env-control.test.mjs
        scripts/compare-lifecycle-results.test.mjs
  go-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-go@v5
      with:
        go-version: 1.23.x
        cache-dependency-path: backend/go.sum
    - run: go mod download
    - run: ARCHERY_TEST_REPORT_DIR="$GITHUB_WORKSPACE/test-artifacts/go-unit" ../scripts/test.sh
        go-unit
    - name: Upload Go unit artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: go-unit-artifacts
        path: test-artifacts/go-unit/
        if-no-files-found: ignore
  go-integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-go@v5
      with:
        go-version: 1.23.x
        cache-dependency-path: backend/go.sum
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - uses: docker/setup-buildx-action@v3
    - run: go mod download
      working-directory: backend
    - run: scripts/test.sh go-integration
    - name: Upload integration artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: go-integration-artifacts
        path: test-artifacts/
        if-no-files-found: ignore
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: npm run typecheck
    - run: npm run lint
    - run: npm run build
      env:
        NEXT_PUBLIC_API_BASE_PATH: /api/
    - run: npm run test:unit:coverage
    - run: npm run test:browser
    - name: Upload browser artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: browser-artifacts
        path: |
          frontend/test-results/browser/
          frontend/playwright-report/browser/
          frontend/coverage/
        if-no-files-found: ignore
  e2e-manual-engine:
    if: github.event_name == 'workflow_dispatch' && inputs.browser != 'chromium'
    runs-on: ubuntu-24.04
    env:
      ARCHERY_E2E_MODE: ${{ inputs.mode }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - uses: actions/setup-go@v5
      with:
        go-version: 1.23.x
        cache-dependency-path: backend/go.sum
    - run: npm ci
      working-directory: frontend
    - run: npx playwright install --with-deps ${{ inputs.browser }}
      working-directory: frontend
    - run: go mod download
      working-directory: backend
    - run: scripts/test.sh e2e --project=${{ inputs.browser }}
    - name: Upload E2E artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-${{ inputs.browser }}-artifacts
        path: |
          test-artifacts/e2e/
          frontend/test-results/e2e/
          frontend/playwright-report/e2e/
        if-no-files-found: ignore
